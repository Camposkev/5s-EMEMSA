<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Video guía · Subsanación 5S · EMEMSA</title>
<meta name="description" content="Video guía para el facilitador del área: cómo subsanar las observaciones del reporte de inspección 5S.">
<meta name="theme-color" content="#1C272B">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#141B1E;--panel:#1D262A;--ink:#E7ECEC;--muted:#9AA8AC;--tape:#F2B705;--line:#33424A}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;min-height:100dvh}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:#fff}
header img{height:30px;width:auto;display:block}
header span{font-weight:700;color:#1C272B;font-size:.92rem}
.cinta{height:6px;background:repeating-linear-gradient(-45deg,var(--tape) 0 12px,#1C272B 12px 24px)}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
.marco{position:relative;width:100%;max-width:1100px;aspect-ratio:16/9;max-height:calc(100dvh - 190px);background:#000;border-radius:14px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.45)}
video{width:100%;height:100%;display:block;background:#000}
#sonido{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);white-space:nowrap;display:flex;align-items:center;gap:10px;border:0;border-radius:999px;padding:14px 22px;background:var(--tape);color:#1C272B;font:800 1.05rem "Plus Jakarta Sans",sans-serif;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:latido 1.6s ease-in-out infinite}
#sonido[hidden]{display:none}
#sonido svg{flex:none}
@keyframes latido{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.06)}}
@media (max-width:600px){#sonido{padding:9px 14px;font-size:.88rem;gap:7px}#sonido svg{width:18px;height:18px}}
@media (prefers-reduced-motion:reduce){#sonido{animation:none}}
h1{margin:0;font-size:1.25rem;font-weight:800;text-align:center;letter-spacing:-.01em}
p{margin:0;color:var(--muted);font-size:.9rem;text-align:center;max-width:60ch}
.acciones{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);text-decoration:none;font-weight:700;font-size:.92rem;padding:10px 16px;border-radius:10px}
.btn.prim{background:var(--tape);border-color:var(--tape);color:#1C272B}
.btn:focus-visible,#sonido:focus-visible{outline:3px solid #fff;outline-offset:2px}
footer{text-align:center;color:var(--muted);font-size:.78rem;padding:10px 16px 16px}
footer a{color:inherit}
</style>
</head>
<body>
<header><img src="logo.png" alt="EMEMSA"><span>Programa 5S</span></header>
<div class="cinta"></div>
<main>
  <div class="marco">
    <video id="v" src="tutorial_facilitador.mp4" poster="tutorial_facilitador.jpg" autoplay muted playsinline controls preload="auto"></video>
    <button id="sonido" type="button" aria-label="Activar sonido del video">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
      Activar sonido
    </button>
  </div>
  <h1>Subsanación de observaciones · Facilitador del área</h1>
  <p>Cómo cargar el informe, registrar la foto del después y generar el Word subsanado.</p>
  <div class="acciones">
    <a class="btn prim" href="levantamiento.html">Ir a la subsanación</a>
    <a class="btn" href="index.html">Inicio de la app</a>
  </div>
</main>
<footer>¿Dudas o sugerencias? Escríbenos a <a href="mailto:auxiliar5s@ememsa.pe">auxiliar5s@ememsa.pe</a></footer>
<script>
(function(){
  var v=document.getElementById('v'),b=document.getElementById('sonido');
  function conSonido(){v.muted=false;v.volume=1;if(v.currentTime<12)v.currentTime=0;var p=v.play();if(p&&p.catch)p.catch(function(){});b.hidden=true}
  b.addEventListener('click',conSonido);
  v.addEventListener('volumechange',function(){if(!v.muted)b.hidden=true});
  // Los navegadores solo permiten arrancar solo en silencio: el botón activa el sonido desde el inicio.
  var p=v.play();if(p&&p.catch)p.catch(function(){});
})();
</script>
</body>
</html>
