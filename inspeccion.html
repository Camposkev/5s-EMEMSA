<style>
:root{
  --bg:#EEF1F0; --panel:#FFFFFF; --ink:#1C272B; --muted:#5D6B70; --line:#D3DADB;
  --tape:#F2B705; --tapeInk:#1C272B; --ok:#2E7D5B; --red:#D7263D; --field:#F7F9F9;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#141B1E; --panel:#1D262A; --ink:#E7ECEC; --muted:#9AA8AC; --line:#33424A; --field:#172024;
  --tape:#F2B705; --tapeInk:#141B1E; --ok:#5BB38A; --red:#FF5C6F; color-scheme:dark;
}}
:root[data-theme="dark"]{ --bg:#141B1E; --panel:#1D262A; --ink:#E7ECEC; --muted:#9AA8AC; --line:#33424A; --field:#172024; --ok:#5BB38A; --red:#FF5C6F; --tapeInk:#141B1E; color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 "Barlow",system-ui,-apple-system,"Segoe UI",sans-serif; min-height:100%}
h1,h2,h3,.cond{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif}
.wrap{max-width:760px; margin:0 auto; padding:16px 16px 120px}
header.top{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap; margin:6px 0 14px}
header.top h1{font-size:2rem; line-height:1; margin:0; font-weight:700; letter-spacing:.01em}
header.top p{margin:4px 0 0; color:var(--muted); font-size:.95rem}
nav.tabs{display:flex; gap:4px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:4px}
nav.tabs button{border:0; background:none; color:var(--muted); font:600 1rem "Barlow Condensed",sans-serif; padding:6px 14px; border-radius:7px; cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--ink); color:var(--bg)}
section.card{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px}
section.card>h2{font-size:1.35rem; margin:0 0 12px; font-weight:600}
.grid{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.grid .full{grid-column:1/-1}
@media (max-width:520px){.grid{grid-template-columns:1fr}}
label.f{display:flex; flex-direction:column; gap:4px; font-size:.88rem; color:var(--muted); font-weight:500}
input,select,textarea{font:inherit; color:var(--ink); background:var(--field); border:1px solid var(--line); border-radius:8px; padding:9px 10px; width:100%; min-width:0}
textarea{resize:vertical; min-height:62px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--tape); outline-offset:1px}
.btn{font:600 1rem "Barlow Condensed",sans-serif; letter-spacing:.02em; border:1px solid var(--line); background:var(--panel); color:var(--ink); padding:9px 14px; border-radius:8px; cursor:pointer; display:inline-flex; align-items:center; gap:6px}
.btn.primary{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.btn.ghost{background:none}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.5; cursor:default}
.row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.hz{border-left:6px solid var(--tape)}
.hz-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px}
.num{font:700 1.5rem "Barlow Condensed",sans-serif; display:flex; align-items:center; gap:10px}
.num span.badge{background:#808080; color:#fff; width:34px; height:34px; display:grid; place-items:center; border-radius:3px; font-size:1.2rem}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 12px}
.chip{border:1px solid var(--line); background:var(--field); color:var(--ink); border-radius:999px; padding:6px 12px; font:500 .95rem "Barlow",sans-serif; cursor:pointer}
.chip[aria-pressed="true"]{background:var(--tape); color:var(--tapeInk); border-color:var(--tape); font-weight:600}
.photos{display:flex; gap:8px; flex-wrap:wrap; margin:6px 0 12px}
.ph{position:relative; width:104px; height:104px; border-radius:8px; overflow:hidden; border:1px solid var(--line); background:var(--field); cursor:pointer; padding:0}
.ph img{width:100%; height:100%; object-fit:cover; display:block}
.ph .x{position:absolute; top:4px; right:4px; width:26px; height:26px; border-radius:50%; border:0; background:rgba(0,0,0,.65); color:#fff; font-size:16px; line-height:26px; cursor:pointer}
.ph .mk{position:absolute; left:0; right:0; bottom:0; background:rgba(0,0,0,.55); color:#fff; font-size:.75rem; text-align:center; padding:2px 0}
.addph{width:104px; height:104px; border:1.5px dashed var(--line); border-radius:8px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; color:var(--muted); background:none; cursor:pointer; font:500 .85rem "Barlow",sans-serif}
.addph b{font-size:1.6rem; line-height:1; font-weight:400}
.hint{color:var(--muted); font-size:.88rem; margin:0}
.empty{text-align:center; padding:28px 12px; color:var(--muted)}
.bar{position:fixed; left:0; right:0; bottom:0; background:var(--panel); border-top:1px solid var(--line); padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px)); z-index:5}
.bar::before{content:""; position:absolute; left:0; right:0; top:-6px; height:6px; background:repeating-linear-gradient(-45deg,var(--tape) 0 12px,#1C272B 12px 24px)}
.bar .in{max-width:760px; margin:0 auto; display:flex; gap:10px; align-items:center; justify-content:space-between}
.bar .status{font-size:.9rem; color:var(--muted)}
.bar .row{flex-wrap:nowrap}
@media (max-width:440px){.bar .status{display:none}.bar .in{justify-content:flex-end}}
.cat-s h3{font-size:1.2rem; margin:14px 0 8px}
.cat-item{display:grid; grid-template-columns:1fr 1fr auto; gap:8px; margin-bottom:8px; align-items:start}
@media (max-width:560px){.cat-item{grid-template-columns:1fr}}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:96px; background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:8px; z-index:20; max-width:90vw; font-weight:500}
/* editor */
.ed{position:fixed; inset:0; background:#0E1416; z-index:30; display:flex; flex-direction:column; padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.ed .tools{display:flex; gap:8px; padding:10px 12px; flex-wrap:wrap; align-items:center; justify-content:space-between}
.ed .tools .row .btn{background:#1D262A; color:#E7ECEC; border-color:#33424A}
.ed .tools .btn[aria-pressed="true"]{background:var(--red); border-color:var(--red); color:#fff}
.ed .stage{flex:1; display:flex; align-items:center; justify-content:center; overflow:hidden; padding:8px}
.ed canvas{max-width:100%; max-height:100%; touch-action:none; background:#000}
.ed .tip{color:#9AA8AC; font-size:.85rem; text-align:center; padding:0 12px 10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* v2 */
.sec{padding:0; overflow:hidden}
.sec-head{padding:12px 16px; display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap}
.sec-head .t{font:700 1.25rem "Barlow Condensed",sans-serif; letter-spacing:.01em}
.sec-body{padding:14px 16px 16px}
.sw{display:flex; gap:6px; flex-wrap:wrap; margin:8px 0 2px}
.sw button{width:28px; height:28px; border-radius:6px; border:1px solid rgba(0,0,0,.25); cursor:pointer; padding:0}
.sw button[aria-pressed="true"]{outline:3px solid var(--ink); outline-offset:2px}
.ficha{border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:12px; background:var(--field)}
.ficha-top{display:flex; gap:12px; align-items:flex-start}
.ficha-top .ph{width:132px; height:132px; flex:none}
.ficha-meta{flex:1; min-width:0}
.pg{font:600 .95rem "Barlow Condensed",sans-serif; color:var(--muted); margin:0 0 6px}
.hzbox{border-top:1px dashed var(--line); margin-top:12px; padding-top:10px}
.hzbox h4{margin:0 0 6px; font:600 1.05rem "Barlow Condensed",sans-serif; display:flex; justify-content:space-between; align-items:center}
.sug{list-style:none; margin:4px 0 0; padding:0; border:1px solid var(--line); border-radius:8px; background:var(--panel); max-height:260px; overflow:auto}
.sug li button{display:block; width:100%; text-align:left; border:0; border-bottom:1px solid var(--line); background:none; color:var(--ink); padding:8px 10px; font:inherit; font-size:.92rem; cursor:pointer}
.sug li button small{display:block; color:var(--muted); font-size:.8rem}
.sug li:last-child button{border-bottom:0}
.prev{margin-top:12px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:.9rem}
.prev b{font:600 .95rem "Barlow Condensed",sans-serif; color:var(--muted); display:block; margin-bottom:4px}
.prev p{margin:2px 0}
.addsec{display:flex; gap:8px; flex-wrap:wrap}
.addsec select{flex:1; min-width:200px}
.sub-row{display:grid; grid-template-columns:1fr auto auto; gap:8px; align-items:center; margin-top:8px}
.colorpick{width:44px; height:38px; padding:2px; border-radius:8px}
details.col summary{cursor:pointer; color:var(--muted); font-size:.88rem}
.area-card{border:1px solid var(--line); border-radius:10px; padding:12px; margin-top:12px}
#tema button[aria-pressed="true"]{background:var(--ink); color:var(--bg)}
#tema button{font:600 .95rem "Barlow Condensed",sans-serif; border:0; background:none; color:var(--muted); padding:6px 10px; border-radius:7px; cursor:pointer}
@media (max-width:520px){header.top{flex-direction:column; align-items:stretch}}
.cel{position:fixed; inset:0; z-index:50; background:rgba(14,20,22,.72); display:flex; align-items:center; justify-content:center; padding:20px; overflow:hidden}
.cel-box{position:relative; background:var(--panel); color:var(--ink); border-radius:16px; padding:28px 24px 22px; max-width:420px; width:100%; text-align:center; border-top:8px solid var(--tape); animation:pop .35s ease-out}
.cel-box h2{font:700 2.2rem "Barlow Condensed",sans-serif; margin:10px 0 4px}
.cel-num{font-weight:600; margin:0 0 12px}
.cel-frase{font:500 1.1rem/1.4 "Barlow",sans-serif; margin:0 0 12px; color:var(--ink)}
.cel-ic svg .chk{stroke-dasharray:90; stroke-dashoffset:90; animation:draw .6s .2s ease-out forwards}
.conf{position:absolute; inset:0; pointer-events:none}
.conf i{position:absolute; top:-12px; width:9px; height:14px; border-radius:2px; animation:fall 2.4s ease-in forwards}
@keyframes fall{to{top:105%; opacity:.2}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{transform:scale(.9); opacity:0}to{transform:none; opacity:1}}
@media (prefers-reduced-motion:reduce){.conf{display:none}.cel-ic svg .chk{stroke-dashoffset:0; animation:none}.cel-box{animation:none}}
.pie{max-width:760px; margin:28px auto 0; padding:14px 4px 0; border-top:1px solid var(--line); color:var(--muted); font-size:.82rem; line-height:1.5; text-align:center}
.pie p{margin:2px 0}
.pie strong{font-weight:600; color:var(--ink)}

<script>// === generador docx (compartido navegador/node) ===
function xmlEsc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function findPara(xml,marker){var re=new RegExp('<w:p[ >](?:(?!<w:p[ >]).)*?'+marker.replace(/[{}]/g,'\\$&')+'.*?</w:p>');var m=xml.match(re);return m?m[0]:null}
function expandList(xml,marker,items){var tpl=findPara(xml,marker);if(!tpl)return xml;
  var out=items.map(function(t,i){return tpl.split('{{N}}').join(String(i+1)).split(marker).join(xmlEsc(t));}).join('');
  if(!items.length)out='<w:p/>';return xml.replace(tpl,function(){return out});}
function imgRun(rid,name,id,cx,cy){return '<w:r><w:drawing><wp:inline distT="45720" distB="45720" distL="57150" distR="57150"><wp:extent cx="'+cx+'" cy="'+cy+'"/><wp:docPr id="'+id+'" name="Foto '+id+'"/><wp:cNvGraphicFramePr><a:graphicFrameLocks xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" noChangeAspect="1"/></wp:cNvGraphicFramePr><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="'+id+'" name="'+name+'"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="'+rid+'"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="'+cx+'" cy="'+cy+'"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>'}
/* data: {proyecto,numero,fecha,area,jefe,inspector, bloques:[{titulo,fill,tcolor,items:[{s,d,r,fotos:[{bytes,w,h}]}]}]} (máx. 2 fotos por bloque) */
async function buildDocx(JSZip, templateB64, data){
  var zip=await JSZip.loadAsync(templateB64,{base64:true});
  var doc=await zip.file('word/document.xml').async('string');
  var rels=await zip.file('word/_rels/document.xml.rels').async('string');
  var simple={PROYECTO:data.proyecto,NUMERO:data.numero,FECHA:data.fecha,AREA:data.area,JEFE:data.jefe,INSPECTOR:data.inspector};
  var ti=doc.indexOf('{{TITULO}}'),ts=doc.lastIndexOf('<w:tbl>',ti),te=doc.indexOf('</w:tbl>',ti)+8;
  var tbl=doc.substring(ts,te);
  var EMU=914400, n=0, id=500, parts=[];
  (data.bloques||[]).forEach(function(b,bi){
    var x=tbl.split('{{TITULO}}').join(xmlEsc(b.titulo)).split('{{FILL}}').join(b.fill||'DEEAF6').split('{{TCOLOR}}').join(b.tcolor||'000000');
    x=expandList(x,'{{L_S}}',b.items.map(function(it){return it.s}));
    x=expandList(x,'{{L_DESC}}',b.items.map(function(it){return it.d}));
    x=expandList(x,'{{L_REC}}',b.items.map(function(it){return it.r}));
    var fotos=[];b.items.forEach(function(it){(it.fotos||[]).forEach(function(f){fotos.push(f)})});
    var k=fotos.length, maxW=(k>1?2.3:4.6)*EMU, maxH=2.25*EMU, runs=[];
    fotos.forEach(function(f){n++;id++;
      var rid='rIdFoto'+n,name='foto'+n+'.jpg';zip.file('word/media/'+name,f.bytes);
      rels=rels.replace('</Relationships>','<Relationship Id="'+rid+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/'+name+'"/></Relationships>');
      var s=Math.min(maxW/f.w,maxH/f.h);runs.push(imgRun(rid,name,id,Math.round(f.w*s),Math.round(f.h*s)));});
    x=x.replace('<w:r><w:t>{{FOTOS}}</w:t></w:r>',function(){return runs.join('<w:r><w:t xml:space="preserve"> </w:t></w:r>')});
    if(bi>0)parts.push('<w:p><w:pPr><w:spacing w:before="0" w:after="0" w:line="20" w:lineRule="exact"/><w:rPr><w:sz w:val="2"/></w:rPr></w:pPr><w:r><w:rPr><w:sz w:val="2"/></w:rPr><w:br w:type="page"/></w:r></w:p>');
    parts.push(x);
  });
  doc=doc.substring(0,ts)+parts.join('')+doc.substring(te);
  Object.keys(simple).forEach(function(k){doc=doc.split('{{'+k+'}}').join(xmlEsc(simple[k]));});
  zip.file('word/document.xml',doc); zip.file('word/_rels/document.xml.rels',rels);
  return zip;
}
if(typeof module!=='undefined') module.exports={buildDocx:buildDocx};
</script>

var SEEDS={"cat": [{"s": "Clasificación", "d": "Se encontraron objetos innecesarios en el puesto de trabajo.", "r": "Retirar los objetos innecesarios y aplicar tarjeta roja si corresponde."}, {"s": "Clasificación", "d": "Documentos obsoletos acumulados en el escritorio o archivador.", "r": "Depurar los documentos según su tiempo de retención y archivar o desechar."}, {"s": "Clasificación", "d": "Se observó objetos detras del armario.", "r": "Retirar del área los objetos obsoletos."}, {"s": "Clasificación", "d": "Se observó gavetas sucias y los objetos no coinciden con la etiqueta.", "r": "Se recomienda limpiar la gaveta de toda suciedad y colocar lo que indican las etiquetas, caso contrario cambiar de etiqueta de lo que se guardara."}, {"s": "Clasificación", "d": "Se observó objetos que no pertenecen a las gavetas y etiquetas.", "r": "Se recomienda retirar dichos objetos y guardarlos en el lugar asignado y cambiar las etiquetas de “HERRAMIENTAS” con el nombre del objeto en específico para evitar acumulación y desorden."}, {"s": "Clasificación", "d": "Se observó mascarilla en gaveta de útiles de oficina.", "r": "Se sugiere retirar la mascarilla y guardarlos en el lugar asignado para ello."}, {"s": "Clasificación", "d": "Se evidencian electrodos ubicados de manera inadecuada sobre una máquina, en un lugar que no corresponde a su almacenamiento.", "r": "Retirar los electrodos de la máquina y ubicarlos en el lugar de almacenamiento correspondiente, evitando colocar materiales sobre equipos que no estén destinados para dicho fin."}, {"s": "Clasificación", "d": "Se encontraron diversos objetos almacenados en un espacio identificado exclusivamente para EPP’s.", "r": "Retirar los objetos que no correspondan al espacio de EPP’s y mantener únicamente los elementos destinados para este fin."}, {"s": "Clasificación", "d": "Se evidenció un palet ubicado de manera inadecuada, generando una condición que podría ocasionar un incidente o accidente.", "r": "Retirar o reubicar el palet en el espacio establecido, manteniendo las áreas de tránsito despejadas y seguras."}, {"s": "Clasificación", "d": "Se evidencian retazos de papel desordenados dentro de un cajón.", "r": "Ordenar y clasificar los retazos de papel, retirando aquellos que no sean necesarios y manteniendo el cajón organizado."}, {"s": "Clasificación", "d": "Se evidencia un cajón identificado como “Ficha Técnica” que contiene también señaléticas de seguridad.", "r": "Retirar las señaléticas de seguridad del cajón de “Ficha Técnica” y ubicarlas en el espacio correspondiente, manteniendo cada elemento según su clasificación."}, {"s": "Orden", "d": "Útiles de escritorio sin ubicación definida.", "r": "Asignar una ubicación fija a cada útil e identificarla."}, {"s": "Orden", "d": "Cables desordenados bajo el escritorio.", "r": "Agrupar y fijar los cables con canaletas o cintillos."}, {"s": "Orden", "d": "Se hayo envases de grasa fuera de lugar.", "r": "Se recomienda mantener los envases de grasa en su ubicación asignada para evitar desorden."}, {"s": "Orden", "d": "Se observo Epps usados en tacho de tochos.", "r": "Se recomienda colocar los EPPs después del uso en el contenedor designado para tal fin."}, {"s": "Orden", "d": "Se observó dos tomatodo y trapo industrial fuera del lugar asignado.", "r": "Se recomienda retirar el trapo y los tomatodos del puesto de trabajo y ubicarlos en el lugar asignado."}, {"s": "Orden", "d": "Se observó una barra fuera de lugar.", "r": "Se recomienda retirar la barra y almacenarla en el lugar asignado."}, {"s": "Orden", "d": "Se observó herramientas fuera de lugar.", "r": "Se recomienda retirar dicha herramienta de encima del tablero de control y guárdala en el lugar asignado para ello."}, {"s": "Orden", "d": "Se observó llaves en el piso.", "r": "Se recomienda recoger las Llaves y almacenarlas en el lugar asignado."}, {"s": "Orden", "d": "Se observó pedazos de mayólica en el piso.", "r": "Se recomienda recoger los fragmentos de mayólica y desecharlos en el recipiente designado, a fin de prevenir riesgos y conservar el área limpia."}, {"s": "Orden", "d": "Se observan 2 bidones de plástico con botas de JEBE adentro ubicados debajo de la mesa.", "r": "Reubicar los EPPS en un lugar diferente y rotular."}, {"s": "Orden", "d": "Se evidencia desorden en el área destinada al almacenamiento de EPP, observándose una disposición inadecuada que dificulta su identificación, acceso y control.", "r": "Garantizar el correcto almacenamiento de los EPP para facilitar su disponibilidad inmediata y evitar condiciones inseguras y a su vez mejorar el impacto visual."}, {"s": "Orden", "d": "Se evidencia una careta colocada encima de un dispositivo para soldaduras, la cual no corresponde a su ubicación asignada.", "r": "Retirar la careta de soldadura del dispositivo y ubicarla en su lugar establecido, manteniendo el área ordenada y libre de objetos ajenos a su ubicación."}, {"s": "Orden", "d": "Se evidencian barras retráctiles para conos ubicadas sobre plataformas de trabajo, las cuales no corresponden a su lugar evidenciado, generando desorden.", "r": "Retirar las barras retráctiles para conos de las plataformas de trabajo y colocarlas en el área destinada para su almacenamiento, evitando utilizar las plataformas como zonas de almacenamiento."}, {"s": "Orden", "d": "Se evidencian restos de producción anterior en el suelo, generando desorden y un impacto visual negativo en el área de trabajo.", "r": "Retirar y disponer adecuadamente los restos de producción anterior, manteniendo el área de trabajo ordenada y libre de residuos."}, {"s": "Orden", "d": "Se evidencian herramientas ubicadas de manera inadecuada, a pesar de contar con espacios asignados para su almacenamiento.", "r": "Reubicar las herramientas en los espacios asignados, asegurando que cada una permanezca en su lugar correspondiente después de su uso."}, {"s": "Orden", "d": "Se evidencia un pomo de producto químico sin rótulo NFPA y un cono de film ubicado de manera inadecuada, fu     h("button",{class:"btn",text:"+ Agregar área",onclick:function(){areas.push({id:uid(),a:"",j:"",subs:[]});save();render()}}),
    h("button",{class:"btn ghost",text:"Restaurar áreas base",onclick:function(){if(confirm("Se reemplazarán tus áreas por las áreas base.")){areas=seedAreas();save();render()}}})));
  wrap.appendChild(h("div",{class:"area-card",style:"margin-top:18px"},
    h("h3",{class:"cond",style:"margin:0 0 4px;font-size:1.2rem",text:"Compartir configuración"}),
    h("p",{class:"hint",text:"Exporta áreas, sub-áreas y catálogo en un archivo para que todos los auditores usen la misma versión. Quien lo importa reemplaza su configuración."}),
    h("div",{class:"row",style:"margin-top:10px"},
      h("button",{class:"btn",text:"Exportar configuración",onclick:exportarConfig}),
      h("button",{class:"btn",text:"Importar configuración",onclick:function(){document.getElementById("fileCfg").click()}}))));
  return wrap;
}

/* ---------- configuración compartida ---------- */
async function guardarArchivo(name,data){
  var dl=(window.claude&&window.claude.use)?await window.claude.use("downloads").catch(function(){return null}):null;
  if(dl){await dl.save({filename:name,data:data});return}
  var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data]));a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},2000)}
async function exportarConfig(){
  var cfg={tipo:"config-5s-ememsa",version:1,fecha:today(),areas:areas.map(function(a){return {a:a.a,j:a.j,subs:a.subs}}),catalogo:catalog.map(function(c){return {s:c.s,d:c.d,r:c.r}})};
  try{await guardarArchivo("config-5s-ememsa-"+today()+".json",JSON.stringify(cfg,null,1));toast("Configuración exportada.")}
  catch(e){toast(e&&e.code==="declined"?"Exportación cancelada.":"No se pudo exportar ("+(e&&e.code||"error")+").")}}
document.getElementById("fileCfg").addEventListener("change",async function(e){var f=e.target.files[0];e.target.value="";if(!f)return;
  try{var cfg=JSON.parse(await f.text());if(cfg.tipo!=="config-5s-ememsa"||!Array.isArray(cfg.areas)||!Array.isArray(cfg.catalogo))throw new Error("formato");
    if(!confirm("Se reemplazarán tus áreas ("+areas.length+") y catálogo ("+catalog.length+") por los del archivo: "+cfg.areas.length+" áreas y "+cfg.catalogo.length+" hallazgos. ¿Continuar?"))return;
    areas=cfg.areas.map(function(a){return {id:uid(),a:String(a.a||""),j:String(a.j||""),subs:(a.subs||[]).map(function(s){return {n:String(s.n||""),c:/^[0-9A-Fa-f]{6}$/.test(s.c)?s.c.toUpperCase():"DEEAF6"}})}});
    catalog=cfg.catalogo.filter(function(c){return ESES.indexOf(c.s)>=0}).map(function(c){return {id:uid(),s:c.s,d:String(c.d||""),r:String(c.r||"")}});
    save();render();toast("Configuración importada.")}
  catch(err){toast("El archivo no es una configuración válida de la app 5S.")}});

/* ---------- mensaje final ---------- */
var FRASES=[
 "Detectar es el primer paso para mejorar. ¡Gracias por tu mirada atenta!",
 "Cada hallazgo registrado es una oportunidad de mejora para el área.",
 "Las 5S se sostienen con inspecciones como la tuya.",
 "Un lugar para cada cosa y cada cosa en su lugar. ¡Sigamos así!",
 "La mejora continua empieza con observar bien. ¡Excelente trabajo!"];
function celebrar(nh,ns,nf){

  var ic=h("div",{class:"cel-ic"});ic.innerHTML='<svg viewBox="0 0 120 120" width="120" height="120" aria-hidden="true"><circle cx="60" cy="60" r="54" fill="#2E7D5B"/><path d="M36 62 l16 16 l32 -36" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" class="chk"/></svg>';
  var ov=h("div",{class:"cel",role:"dialog","aria-modal":"true","aria-labelledby":"celT"},conf,
    h("div",{class:"cel-box"},ic,
      h("h2",{id:"celT",text:"¡Buen trabajo!"}),
      h("p",{class:"cel-num",text:"Registraste "+nh+(nh===1?" hallazgo":" hallazgos")+" con "+nf+(nf===1?" foto":" fotos")+" en "+ns+(ns===1?" sub-área.":" sub-áreas.")}),
      h("p",{class:"cel-frase",text:"“"+frase+"”"}),
      h("p",{class:"hint"},conCorreo("El Word quedó guardado en tu dispositivo. Envíalo al siguiente correo:")),
      h("button",{class:"btn primary",style:"margin-top:14px",text:"Cerrar",onclick:function(){ov.remove()}})));
  document.body.appendChild(ov);ov.querySelector("button").focus();
}

/* ---------- generar ---------- */
async function generar(){
  var falt=[];if(!R.area.trim())falt.push("el área");if(!R.inspector.trim())falt.push("el encargado");
  if(!R.secciones.length)falt.push("al menos una sub-área");
  R.secciones.forEach(function(s){if(!s.hallazgos.length)falt.push("fotos en "+s.titulo);
    s.hallazgos.forEach(function(hz){var p=posicion(s,hz);if(!hz.ss.length||!hz.d.trim())falt.push("la S y descripción del hallazgo "+p.num+", hoja "+p.hoja+" de "+s.titulo)})});
  if(falt.length){toast("Falta: "+falt.slice(0,2).join("; ")+(falt.length>2?" (y "+(falt.length-2)+" más)":"."));return}
  if(typeof JSZip==="undefined"){toast("No cargó el generador de Word. Revisa tu conexión y recarga la página.");return}
  flush();
  var b=document.getElementById("btnGen");b.disabled=true;b.textContent="Generando…";
  try{
    var bloques=[];
    for(var si=0;si<R.secciones.length;si++){var s=R.secciones[si],hs=paginar(s);
      for(var k=0;k<hs.length;k++){var items=[];
        for(var j=0;j<hs[k].length;j++){var hz=hs[k][j],fs=[];
          for(var q=0;q<hz.fotos.length;q++){var c=await composeFoto(hz.fotos[q],q===0?j+1:0,1100);
            var blob=await new Promise(function(res){c.toBlob(res,"image/jpeg",.85)});fs.push({bytes:new Uint8Array(await blob.arrayBuffer()),w:c.width,h:c.height})}
          items.push({s:textoS(hz.ss),d:frase(hz.d),r:frase(hz.r),fotos:fs})}
        bloques.push({titulo:s.titulo,fill:s.color,tcolor:textOn(s.color),items:items})}}
    var num="N°"+String(R.numero||"").padStart(4,"0");
    var zip=await buildDocx(JSZip,TEMPLATE_B64,{proyecto:R.proyecto,numero:num,fecha:fmtFecha(R.fecha),area:R.area.toUpperCase(),jefe:R.jefe.toUpperCase(),inspector:R.inspector.toUpperCase(),bloques:bloques});
    var out=await zip.generateAsync({type:"blob",mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
    var name="E-FSIG_022_REPORTE_5S_"+R.area.trim().replace(/[^\wÁÉÍÓÚÑáéíóúñ]+/g,"_")+"_"+num.replace("°","")+".docx";
    var dl=(window.claude&&window.claude.use)?await window.claude.use("downloads").catch(function(){return null}):null;
    if(dl){try{await dl.save({filename:name,data:out});done()}catch(e){if(e&&e.code==="declined")toast("Descarga cancelada.");else if(e&&e.code==="rate_limited")toast("Ya hay una descarga pendiente de confirmar.");else toast("No se pudo guardar el archivo aquí ("+(e&&e.code||"error")+").")}}
    else{var a=document.createElement("a");a.href=URL.createObjectURL(out);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},2000);done()}
  }catch(e){console.error(e);toast("No se pudo generar el Word: "+(e.message||e))}
  finally{b.disabled=false;b.textContent="Generar Word"}
  function done(){if(R.numero>prefs.ultimo)prefs.ultimo=R.numero;save();var nh=0,nf=0;R.secciones.forEach(function(s){nh+=s.hallazgos.length;nf+=nFotos(s)});celebrar(nh,R.secciones.length,nf)}
}
document.getElementById("btnGen").addEventListener("click",generar);
document.getElementById("btnNuevo").addEventListener("click",function(){if(confirm("Se borrará el reporte actual (datos y fotos). ¿Continuar?")){
  R.secciones.forEach(function(s){s.hallazgos.forEach(function(x){x.fotos.forEach(function(f){kvDel("ph:"+f.id)})})});photoSrc={};thumbs={};R=newReport();save();render();scrollTo(0,0)}});
document.querySelectorAll("nav.tabs button").forEach(function(b){b.addEventListener("click",function(){tab=b.dataset.tab;render();scrollTo(0,0)})});

/* ---------- tema ---------- */
function temaActual(){var t=document.documentElement.getAttribute("data-theme");if(t)return t;return matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}
function pintarTema(){var t=temaActual();document.querySelectorAll("#tema button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.t===t?"true":"false")})}
document.querySelectorAll("#tema button").forEach(function(b){b.addEventListener("click",function(){document.documentElement.setAttribute("data-theme",b.dataset.t);try{localStorage.setItem("tema",b.dataset.t)}catch(e){}pintarTema()})});
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",pintarTema)}catch(e){}
pintarTema();

/* ---------- inicio ---------- */
(async function(){
  try{var c=await kvGet("catalog2");if(c)catalog=JSON.parse(c);catalog.forEach(function(x){if(x.s==="Organización")x.s="Orden"})}catch(e){}
  try{var a=await kvGet("areas2");if(a)areas=JSON.parse(a)}catch(e){}
  // incorporar áreas y hallazgos base nuevos sin borrar lo editado
  try{var vistos=JSON.parse((await kvGet("seedsVistos"))||"{}");
    SEEDS.areas.forEach(function(s){if(!vistos["a:"+s.a]&&!areas.some(function(x){return x.a===s.a}))areas.push({id:uid(),a:s.a,j:s.j,subs:s.subs.map(function(x){return {n:x.n,c:x.c}})});vistos["a:"+s.a]=1});
    SEEDS.cat.forEach(function(s){var k="c:"+s.d.slice(0,45);if(!vistos[k]&&!catalog.some(function(x){return x.d===s.d}))catalog.push({id:uid(),s:s.s,d:s.d,r:s.r});vistos[k]=1});
    kvSet("seedsVistos",JSON.stringify(vistos))}catch(e){}
  try{var p=await kvGet("prefs");if(p)prefs=Object.assign(prefs,JSON.parse(p))}catch(e){}
  try{var d=await kvGet("draft3");if(d)R=JSON.parse(d)}catch(e){}
  if(!R){try{var d2=await kvGet("draft2");if(d2){var o=JSON.parse(d2);if(o&&o.v===2){ // migrar borrador anterior
    var map={"Organización":"Orden"};
    o.secciones.forEach(function(s){s.hallazgos=(s.fichas||[]).map(function(fi){var ss=[],dd="",rr="";
      fi.hz.forEach(function(x){var s1=map[x.s]||x.s;if(s1&&ss.indexOf(s1)<0)ss.push(s1);dd=agregar(dd,x.d);rr=agregar(rr,x.r)});
      return {id:uid(),fotos:[fi.foto],ss:ss,d:dd,r:rr}});delete s.fichas});o.v=3;o.mayus=!!prefs.mayus;R=o}}}catch(e){}}
  if(!R||R.v!==3)R=newReport();
  R.secciones.forEach(function(s){s.hallazgos.forEach(function(x){x.ss=x.ss.map(function(v){return v==="Organización"?"Orden":v}).filter(function(v,i,a){return a.indexOf(v)===i})})});
  for(var i=0;i<R.secciones.length;i++){var s=R.secciones[i];
    for(var j=s.hallazgos.length-1;j>=0;j--){var hz=s.hallazgos[j];
      for(var q=hz.fotos.length-1;q>=0;q--){var f=hz.fotos[q],src=await kvGet("ph:"+f.id);if(src){photoSrc[f.id]=src;await refreshThumb(f)}else hz.fotos.splice(q,1)}
      if(!hz.fotos.length)s.hallazgos.splice(j,1)}}
  render();
})();
</script>
